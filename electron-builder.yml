appId: com.resumebuddy
productName: Resume Buddy
copyright: Copyright 2026

directories:
  buildResources: resources
  output: release

# Electron JS compiled output only (no resources/ here — would conflict with extraResources)
files:
  - out/**/*

# Python backend frozen by PyInstaller (--onedir).
# Run `npm run pyinstaller` before `npm run dist:win` to build this directory.
# At runtime: process.resourcesPath + '/backend/run_backend/run_backend.exe'
extraResources:
  - from: dist/backend/run_backend
    to: backend/run_backend
    filter:
      - '**/*'

win:
  target:
    # zip: portable archive — works without Windows Developer Mode / admin privileges.
    # To produce an NSIS installer instead, change to target: nsis (requires Developer Mode
    # enabled on Windows, or run as Administrator, due to macOS symlinks in winCodeSign).
    - target: zip
      arch: [x64]
    # Keep the unpacked directory as a secondary output (useful for testing / direct launch)
    - target: dir
      arch: [x64]
  # icon: resources/icon.ico  ← uncomment and add icon.ico to resources/ for a custom icon

# nsis config retained for future use (uncomment win.target: nsis above to activate)
# nsis:
#   oneClick: false
#   allowToChangeInstallationDirectory: true
#   createDesktopShortcut: true
#   createStartMenuShortcut: true

# macOS and Linux targets omitted for Phase 5 (Windows only).
# Re-add mac: and linux: sections in Phase 5c.
